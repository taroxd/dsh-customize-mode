name: Publish

# Publishes the package to npm with trusted publishing (OIDC). No npm token is
# stored in this repository: GitHub issues a short-lived identity token, npm
# exchanges it for a publish token scoped to this repository and workflow, and
# the release is published with a provenance attestation.
#
# https://docs.npmjs.com/trusted-publishers/
#
# Releases are cut by pushing a version tag, or by running this workflow
# manually from the default branch.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm test

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version ${version}."
            exit 1
          fi

      - run: npm publish --provenance
